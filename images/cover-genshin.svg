<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.76" cy="0.32" r="0.52">
      <stop offset="0" stop-color="#7FE0D0" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7FE0D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9EDE6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#060A16"/>
  <rect width="1200" height="750" fill="url(#g)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <g fill="#ffffff">
    <circle cx="150" cy="110" r="1.3" opacity="0.5"/>
    <circle cx="400" cy="70" r="1" opacity="0.35"/>
    <circle cx="960" cy="140" r="1.4" opacity="0.45"/>
    <circle cx="1120" cy="440" r="1" opacity="0.3"/>
    <circle cx="210" cy="620" r="1.2" opacity="0.4"/>
    <circle cx="660" cy="700" r="1" opacity="0.3"/>
  </g>

  <!-- 42 天周期：三层同心弧 + 刻度 -->
  <g transform="translate(880,300)" fill="none" stroke="#7FE0D0" stroke-width="1.3">
    <circle cx="0" cy="0" r="132" stroke-opacity="0.22"/>
    <circle cx="0" cy="0" r="92" stroke-opacity="0.45"/>
    <path d="M0 -92 A92 92 0 0 1 79.7 46" stroke-opacity="0.95"/>
    <path d="M0 -132 A132 132 0 0 1 114.3 66" stroke-opacity="0.35" stroke-dasharray="4 8"/>
    <g stroke-opacity="0.5">
      <path d="M0 -132 L0 -148"/>
      <path d="M132 0 L148 0"/>
      <path d="M0 132 L0 148"/>
      <path d="M-132 0 L-148 0"/>
    </g>
    <circle cx="0" cy="0" r="7" fill="#7FE0D0" stroke="none"/>
  </g>

  <g fill="#ffffff" fill-opacity="0.42" font-family="Consolas, monospace" font-size="14" letter-spacing="4">
    <text x="72" y="86">CASE 04 — OPERATION TEARDOWN</text>
  </g>

  <g font-family="Arial Black, Archivo, sans-serif" font-weight="800" fill="url(#t)">
    <text x="68" y="430" font-size="118" letter-spacing="-3">GENSHIN</text>
    <text x="68" y="536" font-size="118" letter-spacing="-3">IMPACT</text>
  </g>
  <text x="72" y="596" fill="#7FE0D0" font-family="Microsoft YaHei, sans-serif" font-size="26" letter-spacing="8">原 神 · 长 线 运 营 拆 解</text>

  <line x1="72" y1="650" x2="1128" y2="650" stroke="#ffffff" stroke-opacity="0.14"/>
  <g fill="#ffffff" fill-opacity="0.38" font-family="Consolas, monospace" font-size="14" letter-spacing="3">
    <text x="72" y="690">42-DAY PIPELINE / RETENTION / MONETIZATION</text>
    <text x="820" y="690">27 PAGES</text>
  </g>
</svg>
